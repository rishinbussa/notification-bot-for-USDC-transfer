name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usdc-transfer-dashboard
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: usdc-transfer-dashboard/package-lock.json

      - name: Install
        run: npm ci

      # GitHub sets CI=true, so the tests run once instead of watching,
      # and the build treats lint warnings as errors.
      - name: Test
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
